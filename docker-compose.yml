services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d app"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    ports:
      - "3000:3000"
    # Dane administratora z lokalnego packages/backend/.env (npm run admin:hash).
    env_file:
      - path: packages/backend/.env
        required: false
    environment:
      DATABASE_URL: postgres://user:password@postgres:5432/app
      PORT: "3000"
      # Lokalnie bez HTTPS; frontend z kontenera woła API pod innym portem.
      SESSION_COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    command: ["node", "packages/backend/dist/worker.js"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://user:password@postgres:5432/app
      WORKER_CONCURRENCY: "2"
    # Dłużej niż WORKER_SHUTDOWN_TIMEOUT_SECONDS (domyślnie 30), żeby graceful stop zdążył.
    stop_grace_period: 40s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: packages/frontend-vue-pwa/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
