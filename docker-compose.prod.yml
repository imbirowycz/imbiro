services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: "3000"
      # Administrator — wartości tylko w /opt/imbiro/.env; bez nich deploy się zatrzyma.
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH is required in .env}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-720}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-10080}
      # API stoi za Caddy (1 proxy): prawdziwe IP klienta i protokół z X-Forwarded-*.
      TRUST_PROXY: "1"
      # Frontend i API pod tym samym adresem — CORS niepotrzebny.
      CORS_ORIGINS: ""
      PRICE_BROWSER_URL: http://browser:3100
      PRICE_BROWSER_TOKEN: ${PRICE_BROWSER_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    command: ["node", "packages/backend/dist/worker.js"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-300}
      JOB_RETRY_LIMIT: ${JOB_RETRY_LIMIT:-3}
      JOB_RETRY_DELAY_SECONDS: ${JOB_RETRY_DELAY_SECONDS:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      PRICE_BROWSER_URL: http://browser:3100
      PRICE_BROWSER_TOKEN: ${PRICE_BROWSER_TOKEN:-}
    # Dłużej niż WORKER_SHUTDOWN_TIMEOUT_SECONDS (domyślnie 30), żeby graceful stop zdążył.
    stop_grace_period: 40s
    depends_on:
      postgres:
        condition: service_healthy

  # Łowca cen: Chromium w osobnym kontenerze, bez wystawionego portu (tylko sieć Dockera).
  browser:
    build:
      context: .
      dockerfile: packages/browser/Dockerfile
    restart: unless-stopped
    environment:
      BROWSER_TOKEN: ${PRICE_BROWSER_TOKEN:-}
    shm_size: 512m
    mem_limit: 1g
    volumes:
      - browser_profile:/data

  # Domowe wyjście: przekaźnik do domowego agenta (packages/home-agent, docelowo TV).
  # Port 3300 tylko przez Caddy (/relay/*), proxy CONNECT 3128 tylko w sieci Dockera — bez `ports:`.
  relay:
    build:
      context: .
      dockerfile: packages/home-relay/Dockerfile
    restart: unless-stopped
    environment:
      HOME_AGENT_TOKEN: ${HOME_AGENT_TOKEN:-}
      HOME_PROXY_TOKEN: ${HOME_PROXY_TOKEN:-}
    mem_limit: 128m

  frontend:
    build:
      context: .
      dockerfile: packages/frontend-vue-pwa/Dockerfile
      args:
        # Pusty = frontend woła /api pod tym samym adresem (przez Caddy)
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  browser_profile:
  caddy_data:
  caddy_config:
